app:
    name: PHP
    code: php
    notify: rniranjan@ecloudcontrol.com
build:
    version: 8.4
    env: DEV
    build_file: none
    output_files: output/*.zip
    image_template: phpfpm-8.4
deploy:
    context: plantmaster/DEV
    type: statefulset
    replicas: 1
    port:
    - 80
    
volumes:
  - claim: php-data
    mount: /appz/data
    name: data
    size: 5Gi
    matchLabels: false
properties:
    DB_CONNECTION: mysql
    DB_HOST: mariadb-master-11-4
    DB_HOST_READ: mariadb-slave-11-4
    DB_PORT: 3306
    DB_DATABASE: wordpress
    DB_USERNAME: wordpress
    MYSQL_PASSWORD:
      vault: MYSQL_PASSWORD_KEY
    revision: 3
